<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="App Framework">
  <!-- App Framework mark. A frame of DataRobot data bricks holding a solid core:
       the framework, and the application it holds. 64-unit grid, 12-unit bricks,
       4-unit gutters. Not a variation of the DataRobot symbol — a distinct mark
       in the same brick language. -->
  <style>
    .frame { fill: #0B0B0B }
    @media (prefers-color-scheme: dark) { .frame { fill: #FFFFFF } }
  </style>
  <rect x="2" y="2" width="60" height="12" class="frame"/>
  <rect x="2" y="50" width="60" height="12" class="frame"/>
  <rect x="2" y="18" width="12" height="28" class="frame"/>
  <rect x="50" y="18" width="12" height="28" class="frame"/>
  <rect x="18" y="18" width="28" height="28" fill="#81FBA5"/>
</svg>
