<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="App Framework">
  <!-- Alternate: six data blocks of differing proportion tiling one square —
       separate components resolving into a single application. -->
  <style>
    .frame { fill: #0B0B0B }
    @media (prefers-color-scheme: dark) { .frame { fill: #FFFFFF } }
  </style>
  <rect x="34" y="2" width="28" height="12" class="frame"/>
  <rect x="34" y="18" width="28" height="12" class="frame"/>
  <rect x="2" y="34" width="12" height="28" class="frame"/>
  <rect x="18" y="34" width="44" height="12" class="frame"/>
  <rect x="18" y="50" width="44" height="12" class="frame"/>
  <rect x="2" y="2" width="28" height="28" fill="#81FBA5"/>
</svg>
